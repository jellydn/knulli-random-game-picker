name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7; matches knulli-app-store
        with:
          persist-credentials: false
      - name: Prepare host toolchain
        run: ./.agents/setup
      - name: Check documents, shell scripts, application build, and contracts
        run: ./scripts/check
      - name: Exercise SDL UI at both target sizes with a fake ES library
        run: |
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick
          python3 tests/ui-smoke.py build/host/random-game-picker build/ui-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-ui-evidence
          path: build/ui-smoke/
  device:
    runs-on: ubuntu-26.04
    container: debian:bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and inspect experimental AArch64 package
        run: ./scripts/build-device
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: knulli-aarch64-experimental
          path: build/release/
