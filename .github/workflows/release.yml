name: release

on:
  push:
    tags: [v0.2.2]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./.agents/setup
      - run: ./scripts/check
      - run: |
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick
          python3 tests/ui-smoke.py build/host/random-game-picker build/ui-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-evidence
          path: build/ui-smoke/
          if-no-files-found: error
  device:
    runs-on: ubuntu-26.04
    container: debian:bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/build-device
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package
          path: build/release/
          if-no-files-found: error
  publish:
    needs: [host, device]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-package
          path: release
      - name: Verify release identity and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "v$(jq -r .version release/artifact.json)" = "$TAG"
          test "$(jq -r .asset release/artifact.json)" = "random-game-picker-${TAG#v}-knulli-aarch64.zip"
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Publish the tested package without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* --verify-tag --latest \
            --title "Random Game Picker $TAG" --notes-file docs/release-0.2.2.md
