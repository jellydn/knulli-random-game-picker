name: release

on:
  push:
    tags: [v0.1.0]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./.agents/setup
      - run: ./scripts/check
      - run: |
          sudo apt-get install -y --no-install-recommends xvfb xdotool imagemagick
          python3 tests/ui-smoke.py build/host/random-game-picker build/ui-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-evidence
          path: build/ui-smoke/
  device:
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/build-device
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package
          path: build/release/
  publish:
    needs: [host, device]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-package
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ui-evidence
          path: evidence
      - name: Publish the tested bytes as a stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* evidence/*.png --verify-tag --latest \
            --title "Random Game Picker $TAG" \
            --notes 'First stable release of the current feature set. The owner confirmed the corrected alpha.2 works on TrimUI Smart Pro. Includes system/favorites filters, random selection, scraped artwork and KNULLI-compatible controller bindings and ES launch handoff. Update the complete package, including RandomGamePicker.sh. Requires aarch64 glibc 2.36+, SDL2/image/ttf and local ES HTTP. MagicX Zero 28 and the full launch/return/performance matrix remain unverified. Persistent library caching and Surprise Mode are not included; this is not completion of the full PRD. Read docs/testing.md for scope and limits.'
